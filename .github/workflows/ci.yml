name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.14.0
          cache: npm

      - name: Install dependencies from lockfile
        run: npm ci --include=optional

      - name: Run quality checks
        run: npm run check

      - name: Audit dependencies
        run: npm audit --audit-level=moderate

  container:
    name: Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Build container
        run: docker build --tag astroguide:ci .

      - name: Smoke-test container health
        run: |
          docker run --detach --name astroguide-ci astroguide:ci
          for attempt in {1..20}; do
            status="$(docker inspect --format '{{.State.Health.Status}}' astroguide-ci)"
            [ "$status" = healthy ] && exit 0
            [ "$status" = unhealthy ] && break
            sleep 1
          done
          docker logs astroguide-ci
          exit 1
